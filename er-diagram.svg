<svg xmlns="http://www.w3.org/2000/svg" width="910" height="730" viewBox="0 0 910 730" font-family="Helvetica, Arial, sans-serif">
  <!-- background -->
  <rect x="0" y="0" width="910" height="730" fill="#ffffff"/>

  <!-- title -->
  <text x="455" y="24" text-anchor="middle" font-size="18" font-weight="700" fill="#1f4e79">EduDB — Entity-Relationship Diagram (PostgreSQL)</text>

  <!-- relationship lines (drawn under boxes) -->
  <g stroke="#555" stroke-width="1.5" fill="none">
    <line x1="240" y1="104" x2="360" y2="82"/>
    <line x1="680" y1="82"  x2="560" y2="82"/>
    <line x1="785" y1="117" x2="785" y2="210"/>
    <line x1="785" y1="304" x2="610" y2="372"/>
    <line x1="220" y1="350" x2="380" y2="372"/>
    <line x1="135" y1="163" x2="410" y2="535"/>
    <line x1="495" y1="426" x2="495" y2="535"/>
  </g>

  <!-- STUDENT -->
  <g>
    <rect x="30" y="45" width="210" height="118" fill="#eef3f8" stroke="#1f4e79" stroke-width="1.5"/>
    <rect x="30" y="45" width="210" height="28" fill="#1f4e79"/>
    <text x="135" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">STUDENT</text>
    <text x="42" y="91"  font-family="'Courier New', monospace" font-size="12.5" fill="#222">student_id <tspan fill="#c0392b" font-weight="700">PK</tspan></text>
    <text x="42" y="113" font-family="'Courier New', monospace" font-size="12.5" fill="#222">display_name</text>
    <text x="42" y="135" font-family="'Courier New', monospace" font-size="12.5" fill="#222">password_hash</text>
    <text x="42" y="157" font-family="'Courier New', monospace" font-size="12.5" fill="#222">password_salt</text>
  </g>

  <!-- COURSE -->
  <g>
    <rect x="680" y="45" width="210" height="72" fill="#eef3f8" stroke="#1f4e79" stroke-width="1.5"/>
    <rect x="680" y="45" width="210" height="28" fill="#1f4e79"/>
    <text x="785" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">COURSE</text>
    <text x="692" y="91" font-family="'Courier New', monospace" font-size="12.5" fill="#222">course_id <tspan fill="#c0392b" font-weight="700">PK</tspan></text>
    <text x="692" y="113" font-family="'Courier New', monospace" font-size="12.5" fill="#222">course_title</text>
  </g>

  <!-- ENROLMENT -->
  <g>
    <rect x="360" y="45" width="200" height="72" fill="#eef3f8" stroke="#1f4e79" stroke-width="1.5"/>
    <rect x="360" y="45" width="200" height="28" fill="#1f4e79"/>
    <text x="460" y="64" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ENROLMENT</text>
    <text x="372" y="91" font-family="'Courier New', monospace" font-size="12.5" fill="#222">student_id <tspan fill="#c0392b" font-weight="700">PK,FK</tspan></text>
    <text x="372" y="113" font-family="'Courier New', monospace" font-size="12.5" fill="#222">course_id <tspan fill="#c0392b" font-weight="700">PK,FK</tspan></text>
  </g>

  <!-- QUIZ -->
  <g>
    <rect x="680" y="210" width="210" height="94" fill="#eef3f8" stroke="#1f4e79" stroke-width="1.5"/>
    <rect x="680" y="210" width="210" height="28" fill="#1f4e79"/>
    <text x="785" y="229" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">QUIZ</text>
    <text x="692" y="256" font-family="'Courier New', monospace" font-size="12.5" fill="#222">quiz_id <tspan fill="#c0392b" font-weight="700">PK</tspan></text>
    <text x="692" y="278" font-family="'Courier New', monospace" font-size="12.5" fill="#222">course_id <tspan fill="#c0392b" font-weight="700">FK</tspan></text>
    <text x="692" y="300" font-family="'Courier New', monospace" font-size="12.5" fill="#222">quiz_week</text>
  </g>

  <!-- TOPIC -->
  <g>
    <rect x="30" y="310" width="190" height="72" fill="#eef3f8" stroke="#1f4e79" stroke-width="1.5"/>
    <rect x="30" y="310" width="190" height="28" fill="#1f4e79"/>
    <text x="125" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">TOPIC</text>
    <text x="42" y="356" font-family="'Courier New', monospace" font-size="12.5" fill="#222">topic_id <tspan fill="#c0392b" font-weight="700">PK</tspan></text>
    <text x="42" y="378" font-family="'Courier New', monospace" font-size="12.5" fill="#222">topic_name</text>
  </g>

  <!-- QUESTION -->
  <g>
    <rect x="380" y="310" width="230" height="116" fill="#eef3f8" stroke="#1f4e79" stroke-width="1.5"/>
    <rect x="380" y="310" width="230" height="28" fill="#1f4e79"/>
    <text x="495" y="329" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">QUESTION</text>
    <text x="392" y="356" font-family="'Courier New', monospace" font-size="12.5" fill="#222">question_id <tspan fill="#c0392b" font-weight="700">PK</tspan></text>
    <text x="392" y="378" font-family="'Courier New', monospace" font-size="12.5" fill="#222">quiz_id <tspan fill="#c0392b" font-weight="700">FK</tspan></text>
    <text x="392" y="400" font-family="'Courier New', monospace" font-size="12.5" fill="#222">topic_id <tspan fill="#c0392b" font-weight="700">FK</tspan></text>
    <text x="392" y="422" font-family="'Courier New', monospace" font-size="12.5" fill="#222">question_text</text>
  </g>

  <!-- ATTEMPT -->
  <g>
    <rect x="380" y="535" width="260" height="138" fill="#eef3f8" stroke="#1f4e79" stroke-width="1.5"/>
    <rect x="380" y="535" width="260" height="28" fill="#1f4e79"/>
    <text x="510" y="554" text-anchor="middle" font-size="14" font-weight="700" fill="#ffffff">ATTEMPT</text>
    <text x="392" y="581" font-family="'Courier New', monospace" font-size="12.5" fill="#222">attempt_id <tspan fill="#c0392b" font-weight="700">PK</tspan></text>
    <text x="392" y="603" font-family="'Courier New', monospace" font-size="12.5" fill="#222">student_id <tspan fill="#c0392b" font-weight="700">FK</tspan></text>
    <text x="392" y="625" font-family="'Courier New', monospace" font-size="12.5" fill="#222">question_id <tspan fill="#c0392b" font-weight="700">FK</tspan></text>
    <text x="392" y="647" font-family="'Courier New', monospace" font-size="12.5" fill="#222">is_correct (nullable)</text>
    <text x="392" y="669" font-family="'Courier New', monospace" font-size="12.5" fill="#222">attempted_at</text>
  </g>

  <!-- cardinality labels -->
  <g font-size="12" font-weight="700" fill="#555">
    <text x="222" y="100" text-anchor="middle">1</text>
    <text x="372" y="78"  text-anchor="middle">N</text>
    <text x="694" y="78"  text-anchor="middle">1</text>
    <text x="548" y="78"  text-anchor="middle">N</text>
    <text x="800" y="135" text-anchor="middle">1</text>
    <text x="800" y="206" text-anchor="middle">N</text>
    <text x="794" y="300" text-anchor="middle">1</text>
    <text x="616" y="366" text-anchor="middle">N</text>
    <text x="208" y="344" text-anchor="middle">1</text>
    <text x="392" y="366" text-anchor="middle">N</text>
    <text x="120" y="158" text-anchor="middle">1</text>
    <text x="420" y="528" text-anchor="middle">N</text>
    <text x="512" y="420" text-anchor="middle">1</text>
    <text x="512" y="548" text-anchor="middle">N</text>
  </g>

  <!-- MongoDB remarks box -->
  <g>
    <rect x="650" y="520" width="250" height="150" fill="#fdf2e9" stroke="#e67e22" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="775" y="544" text-anchor="middle" font-size="13" font-weight="700" fill="#e67e22">REMARKS</text>
    <text x="775" y="561" text-anchor="middle" font-size="12" font-weight="700" fill="#e67e22">MongoDB (NoSQL) · F7</text>
    <text x="662" y="586" font-family="'Courier New', monospace" font-size="11.5" fill="#a35211">collection: edudb.remarks</text>
    <text x="662" y="606" font-family="'Courier New', monospace" font-size="11.5" fill="#a35211">one document per learner</text>
    <text x="662" y="626" font-family="'Courier New', monospace" font-size="11.5" fill="#a35211">fields: student_id,</text>
    <text x="662" y="646" font-family="'Courier New', monospace" font-size="11.5" fill="#a35211">display_name, remark,</text>
    <text x="662" y="666" font-family="'Courier New', monospace" font-size="11.5" fill="#a35211">updated_at, by</text>
  </g>

  <!-- legend -->
  <text x="30" y="700" font-size="12" fill="#444">Cardinality: 1 = one, N = many.  PK = primary key, FK = foreign key.</text>
  <text x="30" y="718" font-size="12" fill="#444">Teacher remarks (orange, dashed) are stored in MongoDB, outside the relational schema above.</text>
</svg>
