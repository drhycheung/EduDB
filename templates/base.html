<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EduDB — {{ title }}</title>
  <style>
    :root {
      --bg: #f4f6f9; --surface: #ffffff; --ink: #1f2933; --muted: #61707d;
      --line: #e2e8ee; --accent: #2f6f8f; --accent-2: #1f7a8c;
      --bar: #2f6f8f; --good: #2e7d57; --bad: #b4463a; --skip: #8a94a0;
      --radius: 10px; --shadow: 0 1px 3px rgba(31,41,51,.08), 0 1px 2px rgba(31,41,51,.06);
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--ink); background: var(--bg); line-height: 1.5; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .appbar { background: var(--accent); color: #fff; padding: .6rem 1.25rem;
      display: flex; align-items: center; gap: 1rem; flex-wrap: wrap; }
    .brand { display: flex; align-items: center; gap: .55rem; font-weight: 700; font-size: 1.05rem; }
    .brand .glyph { width: 26px; height: 26px; border-radius: 6px; background: #fff; color: var(--accent);
      display: grid; place-items: center; font-weight: 800; font-size: .85rem; }
    nav.main { display: flex; gap: .9rem; flex-wrap: wrap; margin-left: auto; font-size: .9rem; }
    nav.main a { color: rgba(255,255,255,.85); }
    nav.main a:hover, nav.main a.active { color: #fff; text-decoration: none; font-weight: 700; }
    nav.main a.active { border-bottom: 2px solid #fff; padding-bottom: 2px; }
    .userchip { background: rgba(255,255,255,.15); border-radius: 999px; padding: .2rem .7rem; font-size: .85rem; }
    main { max-width: 960px; margin: 1.5rem auto; padding: 0 1.25rem; }
    .screen-head { display: flex; align-items: baseline; gap: .6rem; margin-bottom: .4rem; }
    .screen-head h1 { margin: 0; font-size: 1.35rem; }
    .sub { color: var(--muted); margin: .1rem 0 1rem; font-size: .92rem; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: .9rem; margin-bottom: 1.25rem; }
    .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: .9rem 1rem; box-shadow: var(--shadow); }
    .kpi .n { font-size: 1.5rem; font-weight: 700; color: var(--accent); }
    .kpi .l { color: var(--muted); font-size: .8rem; }
    .panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
      padding: 1rem 1.1rem 1.2rem; box-shadow: var(--shadow); margin-bottom: 1.25rem; }
    .panel h2 { margin: .1rem 0 .7rem; font-size: 1.02rem; }
    table { width: 100%; border-collapse: collapse; font-size: .92rem; }
    caption { caption-side: bottom; text-align: left; color: var(--muted); font-size: .8rem;
      padding-top: .5rem; font-style: italic; }
    th, td { border: 1px solid var(--line); padding: .45rem .6rem; text-align: left; }
    thead th { background: #eef3f6; }
    tbody tr:nth-child(even) { background: #fafcfd; }
    .ratebar { display: flex; align-items: center; gap: .6rem; }
    .track { flex: 1; background: #eef2f5; border-radius: 6px; height: 14px; overflow: hidden; }
    .fill { height: 100%; background: var(--bar); border-radius: 6px; }
    .pct { width: 3.6rem; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink); }
    .chip { display: inline-block; padding: .05rem .55rem; border-radius: 999px; font-size: .8rem; font-weight: 600; }
    .chip.ok { background: #e4f3ec; color: var(--good); }
    .chip.no { background: #f7e6e3; color: var(--bad); }
    .chip.skip { background: #eef1f4; color: var(--skip); }
    .controls { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; margin-bottom: .8rem; }
    select, input[type=text], input[type=password], button { font: inherit; padding: .4rem .6rem;
      border: 1px solid var(--line); border-radius: 7px; background: #fff; color: var(--ink); }
    button { background: var(--accent); color: #fff; border: none; cursor: pointer; }
    button:hover { background: var(--accent-2); }
    ul, ol { margin: .3rem 0; padding-left: 1.2rem; }
    li { margin: .35rem 0; }
    .src { color: var(--accent-2); font-weight: 600; }
    .note { color: var(--muted); font-size: .85rem; margin-top: .8rem; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .82rem;
      background: #f4f6f8; border: 1px solid var(--line); border-radius: 6px; padding: .5rem .6rem;
      display: block; white-space: pre-wrap; color: #33414d; }
    .bar { background: var(--bar); height: 1.1rem; border-radius: 6px; margin: .25rem 0 .6rem; }
    footer { max-width: 960px; margin: 0 auto 3rem; padding: 1rem 1.25rem; color: var(--muted); font-size: .82rem; }
  </style>
</head>
<body>
  <header class="appbar">
    <div class="brand"><span class="glyph">E</span> EduDB</div>
    <nav class="main">
      <a href="/" {% if request.path == '/' %}class="active"{% endif %}>Dashboard</a>
      <a href="/progress" {% if request.path == '/progress' %}class="active"{% endif %}>Progress</a>
      <a href="/student" {% if request.path == '/student' %}class="active"{% endif %}>My attempts</a>
      <a href="/search" {% if request.path == '/search' %}class="active"{% endif %}>Search</a>
      <a href="/documents" {% if request.path == '/documents' %}class="active"{% endif %}>Question bank</a>
      <a href="/chart" {% if request.path == '/chart' %}class="active"{% endif %}>Chart</a>
      <a href="/parquet" {% if request.path == '/parquet' %}class="active"{% endif %}>Parquet</a>
      {% if user %}<a href="/logout">Sign out</a><span class="userchip">{{ user.name }}</span>
      {% else %}<a href="/login">Sign in</a>{% endif %}
    </nav>
  </header>
  <main>
    <div class="screen-head"><h1>{{ title }}</h1></div>
    {% block body %}{% endblock %}
  </main>
  <footer>EduDB — demonstration learning analytics application for INT4087 (EdUHK). Runs locally with Docker and Flask.</footer>
</body>
</html>
