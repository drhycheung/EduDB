# EduDB local stack. One command starts both databases:
#   docker compose up -d
# Then: pip install -r requirements.txt && python3 seed.py && flask run
# PostgreSQL holds the facts (attempts, students, topics). MongoDB holds the
# F7 teacher remarks, one document per learner.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: edudb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - edudb-data:/var/lib/postgresql/data

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - edudb-mongo:/data/db

volumes:
  edudb-data:
  edudb-mongo:
